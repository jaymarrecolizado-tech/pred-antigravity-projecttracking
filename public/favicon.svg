<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="reconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="50%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="reconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#34d399" />
        </linearGradient>
    </defs>
    
    <!-- Outer Hexagonal Tactical Chassis -->
    <polygon points="32,4 58,18.5 58,45.5 32,60 6,45.5 6,18.5" 
             fill="#0f172a" 
             stroke="url(#reconGrad)" 
             stroke-width="3" 
             stroke-linejoin="round"/>
             
    <!-- Inner Coordinate Grid Crosshairs -->
    <circle cx="32" cy="32" r="18" stroke="url(#reconGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1" opacity="0.4"/>
    
    <!-- Radar Axis Markers -->
    <line x1="32" y1="9" x2="32" y2="15" stroke="url(#reconGlow)" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="49" x2="32" y2="55" stroke="url(#reconGlow)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="16" y2="32" stroke="url(#reconGlow)" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="32" x2="54" y2="32" stroke="url(#reconGlow)" stroke-width="2" stroke-linecap="round"/>

    <!-- Central RECON "R" Vector + Tactical Node -->
    <!-- Stylized Futuristic Monogram 'R' -->
    <path d="M24 20 H33 C36.5 20 38.5 22.5 38.5 25.5 C38.5 28.5 36.5 31 33 31 H28 V44 M28 31 L38 44" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <line x1="24" y1="20" x2="24" y2="44" stroke="url(#reconGlow)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Glowing Telemetry Beacon Dot -->
    <circle cx="38.5" cy="25.5" r="2.2" fill="#10b981"/>
    <circle cx="32" cy="4" r="2" fill="#38bdf8"/>
</svg>
